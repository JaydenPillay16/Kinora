<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="Kinora helps you stay close to the people who matter with thoughtful, personal messages." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kinora — Stay close to what matters</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('kinora-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // ThemeProvider applies the saved or system theme after the app loads.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
